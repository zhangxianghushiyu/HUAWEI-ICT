version: '3.8'

services:
  polymer-platform:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: polymer-platform
    ports:
      - "9521:9521"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=host.docker.internal
      - REDIS_HOST=118.24.173.181
    volumes:
      - ./logs:/app/logs
      - /home/ruoyi/uploadPath:/home/ruoyi/uploadPath
    restart: unless-stopped
    networks:
      - polymer-network

networks:
  polymer-network:
    driver: bridge